name: Validate configuration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # hardware-configuration.nix 是机器生成、gitignored 的（真实 NAS 上
      # 由 nixos-generate-config 生成）。CI 求值只需一个占位模块，
      # intent-add 使其对 flake 可见（与 INSTALL.md 3.2 同一机制）。
      - name: Placeholder hardware-configuration
        run: |
          echo '{ config, lib, pkgs, ... }: {}' > hardware-configuration.nix
          git add -N -f hardware-configuration.nix

      - name: Flake check
        run: nix flake check --accept-flake-config

      - name: Evaluate router-vm wiring
        run: |
          nix eval .#nixosConfigurations.default.config.services.router-vm.enable
          nix eval .#nixosConfigurations.default.config.services.router-vm.os
          nix eval .#nixosConfigurations.default.config.services.router-vm.vmIp
          nix eval .#nixosConfigurations.default.config.systemd.services.router-vm.serviceConfig.ExecStart
          nix eval .#nixosConfigurations.default.config.systemd.services.router-vm-deploy.after
          nix eval .#nixosConfigurations.default.config.systemd.network.networks \
            --apply 'x: { wan = x."50-router-wan".networkConfig.Bridge; lan = x."50-router-lan".networkConfig.Bridge; }'

      - name: Build toplevel (dry-run)
        run: nix build --dry-run .#nixosConfigurations.default.config.system.build.toplevel
